name: Publish to PyPI

# Publishes to PyPI via Trusted Publishing (OIDC) when a GitHub Release is
# published, or by hand for an existing release tag. No API token is stored
# anywhere: PyPI verifies the workflow's short-lived OIDC identity instead.
# Configure the trusted publisher once at
# https://pypi.org/manage/project/twin-update/settings/publishing/

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run all tests
        run: PYTHONPATH=src:tests python -m unittest discover -s tests
      - name: Compile source and tests
        run: python -m compileall -q src tests

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          expected = f"v{metadata['project']['version']}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"release tag {actual!r} does not match {expected!r}")
          PY
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.6.1
          python -m build
      - name: Inspect distribution set
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          metadata = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = metadata["project"]["version"]
          artifacts = sorted(path.name for path in pathlib.Path("dist").iterdir())
          expected = [
              f"twin_update-{version}-py3-none-any.whl",
              f"twin_update-{version}.tar.gz",
          ]
          if artifacts != expected:
              raise SystemExit(f"unexpected distribution set: {artifacts!r}")
          PY
      - name: Scan distributions before publishing
        run: |
          python -m pip install --disable-pip-version-check push-guard==0.4.3
          push-guard scan-package --no-infer dist/*.whl dist/*.tar.gz
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
