[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "twin-update"
version = "0.5.0"
description = "Close, update and verify the same apt-packaged desktop apps on two Linux machines in one run, with a verified one-command rollback."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Dragon Lady" }]
keywords = ["apt", "updates", "rollback", "desktop", "linux", "tailscale"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/Dragon-Lady/twin-update"
Source = "https://github.com/Dragon-Lady/twin-update"
Issues = "https://github.com/Dragon-Lady/twin-update/issues"
Changelog = "https://github.com/Dragon-Lady/twin-update/blob/main/CHANGELOG.md"
Security = "https://github.com/Dragon-Lady/twin-update/security/policy"

[project.scripts]
twin-update = "twin_update.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
twin_update = ["systemd/*.service", "systemd/*.timer"]
